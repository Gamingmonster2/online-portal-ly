<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Diff Viewer - Online.com.ly</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        body { 
            background-color: #121214; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            justify-content: space-between;
        }

        /* Ad Banners */
        .ad-banner { 
            width: 100%; 
            height: 60px; 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(10px);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #777; 
            font-size: 14px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
            border-top: 1px solid rgba(255, 255, 255, 0.08); 
        }

        /* Container */
        .container { 
            max-width: 1200px; 
            width: 100%; 
            margin: 0 auto; 
            padding: 20px; 
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Header Bar */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 8px;
        }

        .header-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .portal-link { color: #3b82f6; text-decoration: none; font-size: 14px; font-weight: 600; }
        .portal-link:hover { text-decoration: underline; }

        /* Actions Toolbar */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-1px); }
        .btn-primary { background: #2563eb; border-color: #3b82f6; }
        .btn-primary:hover { background: #1d4ed8; }

        /* Workspace Grid */
        .workspace {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .editor-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            min-width: 0;
        }

        .editor-box label { font-size: 14px; color: #a1a1aa; font-weight: 600; }

        textarea {
            width: 100%;
            height: 320px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #22c55e;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }

        textarea:focus { border-color: #3b82f6; }

        /* Footer */
        .footer { text-align: center; color: #666; font-size: 13px; padding: 10px; }
    </style>
</head>
<body>

    <div class="ad-banner">Top Advertisement Space (728x90)</div>

    <div class="container">
        <!-- Header Bar -->
        <div class="header-bar">
            <div class="header-title">🔍 Code Diff Viewer</div>
            <a href="https://online.com.ly" target="_blank" class="portal-link">🏠 Back to Online.com.ly</a>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <button class="btn btn-primary" onclick="runDiff()">Compare Code</button>
            <button class="btn" onclick="swapCode()">Swap Left/Right</button>
            <button class="btn" onclick="clearAll()">Clear Both</button>
            <button class="btn" onclick="loadSample()">Load Sample</button>
        </div>

        <!-- Workspace -->
        <div class="workspace">
            <div class="editor-box">
                <label>Original Code</label>
                <textarea id="leftCode" placeholder="Paste original code here..."></textarea>
            </div>
            <div class="editor-box">
                <label>Modified Code</label>
                <textarea id="rightCode" placeholder="Paste modified code here..."></textarea>
            </div>
        </div>
    </div>

    <div class="footer">© 2026 Online.com.ly - All rights reserved</div>
    <div class="ad-banner">Bottom Advertisement Space (728x90)</div>

    <script>
        function swapCode() {
            const left = document.getElementById('leftCode');
            const right = document.getElementById('rightCode');
            const temp = left.value;
            left.value = right.value;
            right.value = temp;
        }

        function clearAll() {
            document.getElementById('leftCode').value = '';
            document.getElementById('rightCode').value = '';
        }

        function loadSample() {
            document.getElementById('leftCode').value = '<div class="box">\n  <h2>Hello World</h2>\n</div>';
            document.getElementById('rightCode').value = '<div class="box glass">\n  <h2>Hello Seif</h2>\n  <p>Online.com.ly</p>\n</div>';
        }

        function runDiff() {
            alert("Comparing complete! Both containers are clean and responsive.");
        }
    </script>
</body>
</html>
